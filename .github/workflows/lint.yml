# PR-гейт: (1) синтаксис всех PHP-файлов через `php -l`,
#          (2) юнит-тесты без сети/БД (tests/test_*.php).
# Мерж в main сразу деплоится в прод (deploy.yml), поэтому это защита —
# не дать fatal-ошибке парсера или регрессии логики уехать на живой сайт.
# Имя job = "lint" → это имя required status check в branch protection на main.
#
# Почему нижняя версия 7.3, а не 7.4:
# 2026-08-08 прод отдал по HTTP «Parse error: unexpected '=>' ... on line 138»
# на tools/migrations/apply_indexes_safe.php — это стрелочная функция `fn() =>`,
# доступная только с 7.4. Значит PHP на проде СТАРЕЕ 7.4, а гейт на 7.4 такую
# синтаксическую ошибку пропускал: PR зелёный, а на живом сайте fatal.
# Линтим снизу (7.3) и сверху (8.2), тесты гоняем на обеих границах.

name: lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    # MySQL для интеграционных тестов. Юнит-тесты БД не касаются, но всё, что
    # реально портит данные (массовые операции, undo, транзакции), без БД не
    # проверить — и потому раньше не проверялось в CI вообще.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: dashboard_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none
          extensions: mysqli

      - name: php -l на всех PHP-файлах (нижняя граница — как на проде)
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "PHP lint FAILED — есть синтаксические ошибки"
            exit 1
          fi
          echo "Все PHP-файлы прошли php -l"

      - name: Юнит-тесты на PHP 7.3 (без сети и БД)
        run: |
          set -uo pipefail
          # Все самодостаточные тесты логики. Падение любого = красный чек = PR не сольётся.
          # Именно glob, а не список: новый tests/test_*.php попадает в гейт автоматически,
          # без правки workflow (раньше гонялся только один файл из пяти).
          fail=0
          for t in tests/test_*.php; do
            echo "──── $t"
            php "$t" || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "Юнит-тесты FAILED (PHP 7.3)"; exit 1; }

      # Второй прогон на PHP 8: код должен пережить и обновление версии на хостинге.
      # Не matrix, а второй setup-php в том же job — имя job обязано остаться "lint",
      # иначе required status check в branch protection на main перестанет находиться.
      # Реальный случай, ради которого шаг добавлен: `count()` без аргумента —
      # на 7.x это Warning, на 8.x фатальная ArgumentCountError.
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli

      - name: Юнит-тесты на PHP 8.2 (без сети и БД)
        run: |
          set -uo pipefail
          fail=0
          for t in tests/test_*.php; do
            echo "──── $t"
            php "$t" || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "Юнит-тесты FAILED (PHP 8.2)"; exit 1; }

      # Интеграционные тесты: полный путь до реального MySQL.
      # Гоняем на 8.2 (сервис уже поднят, версия PHP тут вторична — проверяется
      # логика работы с БД, а не синтаксис). Без TEST_DB_* эти тесты сами
      # скипаются, поэтому раньше в CI они просто молча ничего не проверяли.
      - name: Интеграционные тесты на реальном MySQL
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_USER: root
          TEST_DB_PASS: ''
          TEST_DB_NAME: dashboard_test
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(tests/integration_*.php)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Интеграционных тестов нет — пропускаем"
            exit 0
          fi
          fail=0
          for t in "${files[@]}"; do
            echo "──── $t"
            php "$t" || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "Интеграционные тесты FAILED"; exit 1; }
