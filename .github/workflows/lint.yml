# PR-гейт: (1) синтаксис всех PHP-файлов через `php -l`,
#          (2) юнит-тесты без сети/БД (tests/test_*.php).
# Мерж в main сразу деплоится в прод (deploy.yml), поэтому это защита —
# не дать fatal-ошибке парсера или регрессии логики уехать на живой сайт.
# Имя job = "lint" → это имя required status check в branch protection на main.

name: lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: php -l на всех PHP-файлах
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' -print0)
          if [ "$fail" -ne 0 ]; then
            echo "PHP lint FAILED — есть синтаксические ошибки"
            exit 1
          fi
          echo "Все PHP-файлы прошли php -l"

      - name: Юнит-тесты на PHP 7.4 (без сети и БД)
        run: |
          set -uo pipefail
          # Все самодостаточные тесты логики. Падение любого = красный чек = PR не сольётся.
          # Именно glob, а не список: новый tests/test_*.php попадает в гейт автоматически,
          # без правки workflow (раньше гонялся только один файл из пяти).
          fail=0
          for t in tests/test_*.php; do
            echo "──── $t"
            php "$t" || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "Юнит-тесты FAILED (PHP 7.4)"; exit 1; }

      # Второй прогон на PHP 8: код должен пережить смену версии на хостинге.
      # Не matrix, а второй setup-php в том же job — имя job обязано остаться "lint",
      # иначе required status check в branch protection на main перестанет находиться.
      # Реальный случай, ради которого шаг добавлен: `count()` без аргумента —
      # на 7.4 это Warning, на 8.x фатальная ArgumentCountError.
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Юнит-тесты на PHP 8.2 (без сети и БД)
        run: |
          set -uo pipefail
          fail=0
          for t in tests/test_*.php; do
            echo "──── $t"
            php "$t" || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "Юнит-тесты FAILED (PHP 8.2)"; exit 1; }
